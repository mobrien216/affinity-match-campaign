@media (prefers-reduced-motion: reduce){ :root{ --t-fast:0ms; --t-fill:0ms; } }
@media (max-width:640px){ .fund-card h2{min-height:0} }

/* Paralucent is licensed and self-hosted. Put the font files in public/fonts/; until then Aptos/system fonts are used. */
@font-face{font-family:'Paralucent';src:url('fonts/paralucent-bold.woff2') format('woff2'),url('fonts/paralucent-bold.woff') format('woff');font-weight:600 900;font-style:normal;font-display:swap}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:var(--fs-body);line-height:1.6;color:var(--green);background:var(--white);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;letter-spacing:-.01em;color:inherit}
p{margin:0}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}

/* Brand logo (interim file from the component library; replace with marketing's RGB logo) */
.brand-logo{display:block;aspect-ratio:800/257;height:40px;background:var(--logo-ink,var(--green));-webkit-mask:var(--logo) no-repeat left center/contain;mask:var(--logo) no-repeat left center/contain}
.brand-logo.white{--logo-ink:var(--white)}

/* Hero on Green */
.hero{background:var(--green);color:var(--white);padding:var(--space-6) 0 var(--space-8)}
.hero .brand-logo{margin-bottom:var(--space-8)}
.t-sub{display:flex;align-items:center;gap:14px;font-family:var(--body);font-weight:600;font-size:13px;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.hero .t-sub{color:var(--gray2)}
.hero h1{font-size:var(--fs-display);line-height:1;letter-spacing:-.02em;max-width:15ch;margin-top:18px}
.hero p{font-size:var(--fs-body-lg);line-height:1.6;max-width:56ch;margin-top:var(--space-5);color:var(--gray2)}

/* Thank-you notice */
.thanks{display:none;margin-top:var(--space-6);padding:var(--space-4) var(--space-5);background:var(--gray1);border-left:4px solid var(--mid);border-radius:var(--r);font-weight:600}
.thanks.show{display:block}

/* Fund cards: G8 pillar-card pattern with the affinity fund-type color as the 3px top edge */
.funds{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:var(--space-7)}
.fund-card{display:flex;flex-direction:column;padding:22px;border:1px solid var(--gray3);border-top:3px solid var(--ft-affinity);border-radius:var(--r);background:var(--white)}
.fund-card h2{font-size:var(--fs-h3);line-height:1.15;margin-top:10px;min-height:2.3em} /* two lines, so bars line up across cards */
.fund-card .blurb{margin-top:var(--space-3);font-size:16px;line-height:1.45}

.figure{display:flex;flex-direction:column;gap:6px;margin-top:var(--space-5)} /* goal sits under the figure on every card, so bars align */
.figure strong{font-family:var(--head);font-weight:700;font-size:clamp(40px,4vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.figure span{font-size:var(--fs-caption);color:var(--label);font-weight:600;white-space:nowrap}

/* Progress bar: same anatomy as the library's flow-track, taller for a fundraising goal */
.track{height:12px;margin-top:var(--space-3);border-radius:6px;background:var(--gray3);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:6px;background:var(--ft-affinity);transition:width var(--t-fill) var(--ease)}
.fund-card.reached .track i{background:var(--mid)}

.status{margin-top:var(--space-3);font-weight:700;line-height:1.45}
.impact{margin-top:4px;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.match-note{margin-top:4px;font-size:var(--fs-caption);line-height:1.45;color:var(--label)}

/* Buttons (library .btn .btn-primary .btn-block) */
.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:48px;padding:0 22px;margin-top:auto;border:1.5px solid transparent;border-radius:var(--r-btn);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;text-align:center;cursor:pointer;transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.btn-primary{background:var(--green);border-color:var(--green);color:var(--white)}
.btn-primary:hover{background:var(--mid);border-color:var(--mid)}
.btn[aria-disabled="true"]{background:var(--gray2);border-color:var(--gray2);color:var(--label);pointer-events:none}
.btn-gap{flex:1;min-height:var(--space-5)}

.meta{padding:var(--space-6) 0 var(--space-8);font-size:var(--fs-caption);line-height:1.45;color:var(--label)}
.notice{color:#CB1E4B;font-weight:700}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="wrap">
      <span class="brand-logo white" role="img" aria-label="The Cleveland Foundation"></span>
      <p class="t-sub">Affinity Funds match</p>
      <h1>Double your gift to the Affinity Funds</h1>
      <p>Every dollar given to the funds below is matched dollar for dollar, up to $10,000 per fund. Choose a fund to help it reach the full match.</p>
    </div>
  </header>

  <div class="wrap">
    <div class="thanks" id="thanks" role="status" aria-live="polite"></div>
    <section class="funds" id="funds" aria-label="Fund progress">
      <p>Loading fund totals…</p>
    </section>
    <p class="meta" id="meta" aria-live="polite"></p>
  </div>
</main>

<script>
(() => {
  const POLL_MS = 30000;
  const FAST_POLL_MS = 5000;
  const FAST_POLL_FOR_MS = 60000;

  const fundsEl = document.getElementById('funds');
  const metaEl = document.getElementById('meta');
  const thanksEl = document.getElementById('thanks');

  const params = new URLSearchParams(location.search);
  const thanksFund = params.get('thanks');
  let fastUntil = thanksFund ? Date.now() + FAST_POLL_FOR_MS : 0;
  let lastData = null;
  let timer = null;

  // Floor, never round up: the page should never overstate what's been raised.
  const dollars = (cents) => '$' + Math.floor(cents / 100).toLocaleString('en-US');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function cardHtml(f, goal) {
    const pct = Math.min(100, (f.raised_cents / goal) * 100);
    // Any fund above $0 shows a visible sliver so early gifts register; the dollar figures stay exact.
    const shownPct = f.raised_cents > 0 ? Math.max(pct, 2) : 0;
    const over = f.over_goal_cents > 0;
    const reached = f.raised_cents >= goal;
    const toGo = Math.max(0, goal - f.raised_cents);

    let status;
    if (over) status = `Goal reached, plus ${dollars(f.over_goal_cents)} beyond it`;
    else if (reached) status = 'Goal reached';
    else status = `${dollars(toGo)} to go to unlock the full match`;

    return `
      <article class="fund-card${reached ? ' reached' : ''}" id="${escapeHtml(f.id)}">
        <p class="t-sub">Affinity Fund</p>
        <h2>${escapeHtml(f.name)}</h2>
        ${f.blurb ? `<p class="blurb">${escapeHtml(f.blurb)}</p>` : ''}
        <div class="figure">
          <strong>${dollars(f.raised_cents)}</strong>
          <span>of ${dollars(goal)} goal</span>
        </div>
        <div class="track" role="progressbar" aria-label="${escapeHtml(f.name)} progress"
             aria-valuemin="0" aria-valuemax="${goal / 100}" aria-valuenow="${Math.min(f.raised_cents, goal) / 100}"
             aria-valuetext="${dollars(f.raised_cents)} raised of ${dollars(goal)} goal">
          <i data-pct="${shownPct.toFixed(2)}"></i>
        </div>
        <p class="status">${status}</p>
        <p class="impact">${dollars(f.total_with_match_cents)} total with the match</p>
        ${over ? `<p class="match-note">The first ${dollars(goal)} raised for this fund is matched.</p>` : ''}
        <div class="btn-gap"></div>
        ${f.give_url
          ? `<a class="btn btn-primary" href="${escapeHtml(f.give_url)}" aria-label="Give to the ${escapeHtml(f.name)}">Give to this fund</a>`
          : `<a class="btn" aria-disabled="true">Giving link coming soon</a>`}
      </article>`;
  }

  function render(data) {
    const goal = data.campaign.goal_cents;
    const prevPct = {};
    fundsEl.querySelectorAll('.fund-card').forEach((el) => {
      const fill = el.querySelector('.track i');
      prevPct[el.id] = fill ? fill.style.width : '0%';
    });

    fundsEl.innerHTML = data.funds.map((f) => cardHtml(f, goal)).join('');

    // Start each bar where it was, then animate to the new width.
    fundsEl.querySelectorAll('.fund-card').forEach((el) => {
      const fill = el.querySelector('.track i');
      fill.style.width = prevPct[el.id] || '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = fill.dataset.pct + '%'; }));
    });

    if (thanksFund) {
      const f = data.funds.find((x) => x.id === thanksFund);
      if (f) {
        thanksEl.textContent = `Thank you for your gift to the ${f.name}. It will appear in the total within a minute.`;
        thanksEl.classList.add('show');
      }
    }

    const updated = new Date(data.updated_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let meta = `Totals updated ${updated}.`;
    if (!data.campaign.livemode) meta += ' Test mode: these are not real gifts.';
    if (data.campaign.ended) meta = 'The match campaign has ended. Thank you to everyone who gave. ' + meta;
    metaEl.textContent = meta;
  }

  async function load() {
    try {
      const res = await fetch('/api/totals', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      lastData = await res.json();
      render(lastData);
    } catch (err) {
      if (!lastData) {
        fundsEl.innerHTML = '<p class="notice">Fund totals could not be loaded. Refresh the page to try again.</p>';
      } else {
        metaEl.innerHTML = '<span class="notice">Totals are not updating right now. Giving links still work.</span>';
      }
    } finally {
      schedule();
    }
  }

  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return;
    timer = setTimeout(load, Date.now() < fastUntil ? FAST_POLL_MS : POLL_MS);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else load();
  });

  load();
})();
</script>
</body>
</html>
